name: Quality checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  image: sdk-58
  tools:
    bun: '1.3.6'

jobs:
  quality:
    name: Lint, format, typecheck, and test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: bun run check
      - run: bun run test
      - run: bun run test:timezones
